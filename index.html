<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Конвертер валют</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--text:#161a2b;--muted:#6b7190;--line:#dfe3f0;--accent:#4f46e5;--accent2:#7c3aed;--ok:#0f9d6b;--err:#d93a4a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1220;--card:#181c30;--text:#eef0fb;--muted:#9aa0c3;--line:#2a3050;--accent:#7c78ff;--accent2:#a78bfa;--ok:#3ddc97;--err:#ff6b7a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1220;--card:#181c30;--text:#eef0fb;--muted:#9aa0c3;--line:#2a3050;--accent:#7c78ff;--accent2:#a78bfa;--ok:#3ddc97;--err:#ff6b7a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 24px;box-shadow:0 20px 50px rgba(79,70,229,.12)}
h1{margin:0 0 4px;font-size:1.5rem}
.sub{margin:0 0 22px;color:var(--muted);font-size:.9rem}
label{display:block;font-size:.8rem;color:var(--muted);margin:0 0 6px}
.field{display:flex;gap:8px}
input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:var(--accent)}
input{flex:1;min-width:0;font-size:1.2rem;font-weight:600}
select{width:110px;font-weight:600;cursor:pointer}
.swapwrap{display:flex;justify-content:center;margin:12px 0}
.swap{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--accent);font-size:1.3rem;cursor:pointer;transition:transform .25s}
.swap:hover{transform:rotate(180deg)}
.go{width:100%;margin-top:18px;padding:15px;border:0;border-radius:14px;font:inherit;font-weight:700;font-size:1rem;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.go:active{transform:scale(.98)}
.result{margin-top:20px;padding:18px;border-radius:16px;background:var(--bg);border:1px dashed var(--line);text-align:center;min-height:86px}
.big{font-size:1.8rem;font-weight:800;color:var(--ok);word-break:break-all}
.rate{margin-top:6px;font-size:.85rem;color:var(--muted)}
.err{color:var(--err);font-weight:600}
.splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);transition:opacity .5s}
.splash.hide{opacity:0;pointer-events:none}
.splash svg{width:120px;height:120px;animation:pop .8s ease-out both}
.splash .name{font-size:1.6rem;font-weight:800;letter-spacing:.5px;animation:rise .8s .3s ease-out both}
.splash .tag{margin-top:-10px;color:var(--muted);font-size:.9rem;animation:rise .8s .5s ease-out both}
@keyframes pop{from{opacity:0;transform:scale(.5) rotate(-20deg)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.splash svg,.splash .name,.splash .tag{animation:none}}
.codebtn{position:fixed;z-index:50;left:12px;top:calc(12px + env(safe-area-inset-top,0px));padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--accent);font:inherit;font-weight:700;font-size:.85rem;cursor:pointer;box-shadow:0 6px 18px rgba(79,70,229,.15)}
.codeview{position:fixed;inset:0;z-index:90;display:none;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.codeview.open{display:flex}
.cv-head{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
.cv-tab,.cv-act{font:inherit;font-size:.85rem;font-weight:600;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer}
.cv-tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cv-sp{flex:1}
.cv-cap{padding:10px 14px;font-size:.85rem;color:var(--muted)}
.cv-body{flex:1;margin:0;padding:14px;overflow:auto;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;tab-size:4;color:var(--text)}
</style>
</head>
<body>
<div class="splash" id="splash">
  <svg viewBox="0 0 120 120" aria-label="Логотип">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
    <circle cx="60" cy="60" r="56" fill="url(#lg)"/>
    <path d="M30 48h52M70 36l12 12-12 12" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M90 74H38M50 62L38 74l12 12" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="name">Конвертер валют</div>
  <div class="tag">USD · EUR · RUB</div>
</div>
<button class="codebtn" id="codebtn" type="button">&lt;/&gt; Код</button>
<div class="codeview" id="codeview" role="dialog" aria-label="Код приложения">
  <div class="cv-head">
    <button class="cv-tab on" id="tab-site" type="button">Сайт (HTML · CSS · JS)</button>
    <button class="cv-tab" id="tab-go" type="button">Go (исходная программа)</button>
    <span class="cv-sp"></span>
    <button class="cv-act" id="cv-copy" type="button">Копировать</button>
    <button class="cv-act" id="cv-close" type="button">✕ Закрыть</button>
  </div>
  <div class="cv-cap" id="cv-cap"></div>
  <pre class="cv-body" id="cv-body"></pre>
</div>
<template id="gosrc">package main

import (
	"fmt"
)
func main() {
	ish, a, celev := vodim()
	raschet(ish, a, celev)
}
func vodim() (string, float64, string) {
	var b float64
	var ish1 string
	var celev1 string

	for  {
	fmt.Println("Введите исходную валюту(USD, EUR, RUB)")
	fmt.Scan(&amp;ish1)
	if ish1 != "USD" &amp;&amp; ish1 != "EUR" &amp;&amp; ish1 != "RUB" {
		fmt.Println("Введено некорректное значение")
		continue
	}
	
	break
	}
	for {
	fmt.Println("Введите число для конвертации")
	_, err := fmt.Scan(&amp;b)
	if err != nil {
		fmt.Println("Нужно ввести число")
		continue
	}
	break
}	
	for {
	fmt.Println("Введите целевую валюту, кроме", ish1)
	fmt.Scan(&amp;celev1)
	if celev1 == ish1 || (celev1 != "USD" &amp;&amp; celev1 != "EUR" &amp;&amp; celev1 != "RUB") {
		fmt.Println("Введено некорректное значение")
		continue
	}
	break
	}
	return ish1, b, celev1
}

func raschet(ish string, a float64, celev string) {
	switch ish {
	case "USD":
		switch celev {
		case "RUB":
			fmt.Print(a * 80.30)
		case "EUR":
			fmt.Print(a * 0.89)
		}
	case "RUB":
		switch celev {
		case "EUR":
			fmt.Print(a * 0.011)
		case "USD":
			fmt.Print(a * 0.012)
		}
	case "EUR":
		switch celev {
		case "RUB":
			fmt.Print(a * 90.18)
		case "USD":
			fmt.Print(a * 1.12)
	}
		}
}
</template>
<main class="card">
  <h1>Конвертер валют</h1>
  <p class="sub">USD · EUR · RUB</p>

  <label for="amount">Сумма</label>
  <div class="field">
    <input id="amount" type="text" inputmode="decimal" placeholder="0" autocomplete="off">
    <select id="from" aria-label="Исходная валюта"></select>
  </div>

  <div class="swapwrap"><button class="swap" id="swap" type="button" aria-label="Поменять местами">⇅</button></div>

  <label for="to">Целевая валюта</label>
  <div class="field"><select id="to" style="width:100%" aria-label="Целевая валюта"></select></div>

  <button class="go" id="go" type="button">Конвертировать</button>

  <div class="result" id="result" aria-live="polite"><div class="rate">Введите сумму и нажмите «Конвертировать»</div></div>
</main>

<script>
const SITE_SRC = (() => {
  const c = document.documentElement.cloneNode(true);
  c.querySelectorAll("#codeview,#codebtn,#gosrc").forEach(e => e.remove());
  return "<!DOCTYPE html>\n" + c.outerHTML;
})();
// Те же курсы, что в Go-программе
const RATES = {
  USD: { RUB: 80.30, EUR: 0.89 },
  RUB: { EUR: 0.011, USD: 0.012 },
  EUR: { RUB: 90.18, USD: 1.12 }
};
const CUR = ["USD", "EUR", "RUB"];
const $ = id => document.getElementById(id);
const from = $("from"), to = $("to"), amount = $("amount"), result = $("result");

CUR.forEach(c => { from.add(new Option(c, c)); to.add(new Option(c, c)); });
from.value = "USD"; to.value = "RUB";

// Проверка из Go-кода: целевая валюта не может совпадать с исходной
function same() { return from.value === to.value; }
function sameErr() {
  result.innerHTML = '<div class="err">Введено некорректное значение</div><div class="rate">Целевая валюта должна отличаться от исходной (' + from.value + ')</div>';
}
from.onchange = to.onchange = () => {
  if (same()) sameErr();
  else if (amount.value.trim()) convert();
};

function convert() {
  if (same()) { sameErr(); return; }
  const v = parseFloat(amount.value.replace(",", ".").replace(/\s/g, ""));
  if (isNaN(v)) {
    result.innerHTML = '<div class="err">Нужно ввести число</div>';
    return;
  }
  const r = RATES[from.value][to.value];
  const out = (v * r).toLocaleString("ru-RU", { maximumFractionDigits: 2 });
  result.innerHTML = '<div class="big">' + out + " " + to.value + '</div><div class="rate">1 ' + from.value + " = " + r + " " + to.value + "</div>";
}

$("go").onclick = convert;
amount.addEventListener("keydown", e => { if (e.key === "Enter") convert(); });
$("swap").onclick = () => {
  const t = from.value; from.value = to.value; to.value = t;
  if (amount.value.trim()) convert();
};

// Просмотр кода
const GO_SRC = document.getElementById("gosrc").content.textContent;
const CAPS = {
  site: "Интерфейс сайта: разметка, оформление и та же логика конвертации, перенесённая на JavaScript.",
  go: "Исходная консольная программа на Go (оригинал, без изменений)."
};
let curTab = "site";
function showTab(t) {
  curTab = t;
  $("tab-site").classList.toggle("on", t === "site");
  $("tab-go").classList.toggle("on", t === "go");
  $("cv-cap").textContent = CAPS[t];
  $("cv-body").textContent = t === "site" ? SITE_SRC : GO_SRC;
  $("cv-body").scrollTop = 0;
}
$("codebtn").onclick = () => { showTab(curTab); $("codeview").classList.add("open"); };
$("cv-close").onclick = () => $("codeview").classList.remove("open");
$("tab-site").onclick = () => showTab("site");
$("tab-go").onclick = () => showTab("go");
$("cv-copy").onclick = async () => {
  try {
    await navigator.clipboard.writeText(curTab === "site" ? SITE_SRC : GO_SRC);
    $("cv-copy").textContent = "Скопировано ✓";
  } catch (e) {
    $("cv-copy").textContent = "Не удалось";
  }
  setTimeout(() => { $("cv-copy").textContent = "Копировать"; }, 1500);
};
document.addEventListener("keydown", e => { if (e.key === "Escape") $("codeview").classList.remove("open"); });

// Заставка: показывается ~2 секунды, потом исчезает
setTimeout(() => {
  const s = $("splash");
  s.classList.add("hide");
  setTimeout(() => s.remove(), 600);
}, 2200);
</script>
</body>
</html>
